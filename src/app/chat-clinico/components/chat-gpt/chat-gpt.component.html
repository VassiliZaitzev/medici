<div class="chat-container">
  <div class="messages">
    <div
      *ngFor="let msg of chatRegistrado"
      class="text-end"
      [ngClass]="{'text-end': msg.idTipoMensaje === 0, 'gpt': msg.idTipoMensaje === 1}" [class.user]="msg.idTipoMensaje === 0"
      [class.bot]="msg.idTipoMensaje === 1">
      <span [innerHTML]="msg.mensaje"></span> <!-- Usamos innerHTML aquí -->
      <span class="timestamp" style="font-size: xx-small; margin-left: 7px;">{{ this.fechaActual | date:'hh:mm a' }}</span>
    </div>
  </div>

  <form (submit)="sendMessage()" class="input-form">
    <input type="text" [(ngModel)]="inputText" name="message" placeholder="Escribe un mensaje..." [disabled]="loading"
      autocomplete="off" />
    <button type="submit" [disabled]="loading || !inputText.trim()">Enviar</button>
  </form>

  <div *ngIf="loading" class="loading">Escribiendo...</div>

  <!-- <button class="btn btn-primary" (click)="obtenerDocumento()">Obtener Documento</button>
  <div style="height: 600px;">
    <iframe *ngIf="pdfBase64Safe" [src]="pdfBase64Safe" width="100%" height="600px"></iframe>
  </div> -->
  <div *ngIf="impresionVisible" class="impresion-seccion">
    <h3>Impresión Diagnóstica</h3>
    <button (click)="generarPDF()" class="btn btn-secondary mb-3">Generar PDF</button>
  </div>

</div>
